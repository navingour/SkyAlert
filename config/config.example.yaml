# SkyAlert Aviation Intelligence & ADS-B Fixed Station Configuration
# ─────────────────────────────────────────────────────────────────────────
# INSTRUCTIONS:
#   1. Copy this file to config/config.yaml:
#      cp config/config.example.yaml config/config.yaml
#   2. Customize the values below for your receiver and environment.
# ─────────────────────────────────────────────────────────────────────────

general:
  # Polling interval (seconds) for ADS-B receiver
  poll_interval: 5

# Database Configuration:
# - Leave empty or set to "sqlite:///data/skyalert_relational.db" for zero-config local SQLite.
# - Or provide PostgreSQL connection string: "postgresql://user:pass@host:5432/skyalert"
database:
  url: "sqlite:///data/skyalert_relational.db"

# ADS-B Receiver Feed Endpoint (tar1090 / readsb / dump1090 aircraft.json)
tar1090:
  url: "http://192.168.0.132/tar1090/data/aircraft.json"

# Station Reference Coordinates (used for vicinity alerts, distance, and polar radar)
station:
  latitude: 22.5726
  longitude: 88.3639
  name: "SkyAlert Primary Node"

# Collector & Smart Sampling Settings (prevents database bloat)
collector:
  session_timeout_minutes: 10   # Inactivity gap to close a flight visit
  telemetry:
    enabled: true               # Set to false to only store session aggregates without raw observations
    sample_interval_sec: 30     # Stores breadcrumb trajectory sample every 30s (reduces storage by 95%)

# Telegram Alerting Pipeline
telegram:
  enabled: false
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
  chat_id: "YOUR_TELEGRAM_CHAT_ID"
  photo_enabled: true
  silent: false

# Scenario Alert Triggers
alerts:
  squawk: true         # 7700 General Emergency, 7600 Radio Failure, 7500 Hijack
  emergency: true
  military: true       # IAF, USAF, fighters, tactical transports
  government: true     # VIP, head-of-state, government charters
  police: true         # Police / law enforcement
  helicopters: true    # Bell, Eurocopter, AW139, Mi-17, rotorcraft
  rare_aircraft: true  # A380, An-124, Beluga, B747, C-17, 1-time visitors
  watchlist: true      # Custom target tracking with vicinity filters
  formation: false     # Multi-aircraft formation flights
  geofence: false      # Custom radial zone incursion

# Target Tracking Watchlist
watchlist:
  registrations: []
  operators:
    - "Indian Air Force"
    - "NASA"
    - "Qatar Executive"
  flights:
    - "RCH"
    - "IAF"
  hex: []
  # Structured custom targets with vicinity distance constraints:
  targets:
    - type: "operator"
      value: "Indian Air Force"
      label: "Indian Air Force Defense Fleet"
      radius_km: 50
      enabled: true

# Rare Aircraft Types
rare_aircraft:
  aircraft_types:
    - A388   # Airbus A380
    - A124   # Antonov An-124
    - A225   # Antonov An-225
    - B748   # Boeing 747-8
    - B744   # Boeing 747-400
    - BLCF   # Boeing Dreamlifter
    - A3ST   # Airbus Beluga
    - C17    # C-17 Globemaster
    - C5M    # C-5M Super Galaxy
    - C130   # C-130 Hercules
    - E3TF   # E-3 Sentry AWACS
    - P8     # P-8 Poseidon

# Geofence Perimeter Alarm
geofence:
  enabled: false
  name: "Station Vicinity Zone"
  latitude: 22.5726
  longitude: 88.3639
  radius_km: 50

# Telemetry Anomaly Thresholds
thresholds:
  enabled: false
  min_altitude: 5000
  max_speed: 520

# Supplementary Data Providers (Optional online lookups)
providers:
  hexdb:
    enabled: true
  airframes:
    enabled: true
    api_key: ""
  airlabs:
    enabled: true
    api_key: ""
  api_ninjas:
    enabled: true
    api_key: ""
